name: ci
on:
  push: { branches: [ main ] }
  pull_request: { branches: [ main ] }
jobs:
  spectral-certificates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact algebra and convention checks
        run: python -m unittest discover -s tests -v
      - name: Numerical illustration
        run: python examples/hopf_spectra.py
      - name: Parse illustrative receipt
        run: python -m json.tool receipts/schema.sample.json > /dev/null
