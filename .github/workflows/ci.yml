name: ci
on:
  push: { branches: [ main ] }
  pull_request: {}
jobs:
  spectral-certificates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact algebra and convention checks
        run: python -m unittest discover -s tests -v
      - name: Numerical illustration
        run: python examples/hopf_spectra.py
      - name: Parse illustrative receipt
        run: python -m json.tool receipts/schema.sample.json > /dev/null
      - name: Computed enclosure certificate and replay
        run: |
          python examples/validated_return_map.py > /tmp/validated_return_map.json
          diff receipts/validated_return_map.json /tmp/validated_return_map.json
          python examples/validated_return_map.py --replay receipts/validated_return_map.json
      - name: Pinned DynaComp producer
        uses: actions/checkout@v4
        with:
          repository: towre676-cloud/DynaComp
          ref: cd788c7ac695728e3f5b22056a0f99a2c1e1463c
          path: .bridge-producer
      - name: Cross-project replay and tests
        env:
          PYTHONPATH: .bridge-producer/src
        run: |
          python -m unittest discover -s tests -v
          python examples/dynacomp_return.py --replay receipts/dynacomp_return.json
          python examples/dynacomp_return.py > /tmp/dynacomp_return.json
          diff receipts/dynacomp_return.json /tmp/dynacomp_return.json
